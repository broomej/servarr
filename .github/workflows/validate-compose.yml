name: Validate compose

# Validates the prod and dev compose file combinations on every PR.
# Catches YAML syntax errors, unresolved env var references, and
# verifies the dev override actually does what it claims to.
#
# The actual validator is at scripts/validate-compose.py. Run it locally:
#   python scripts/validate-compose.py

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate compose (prod + dev override semantics)
        run: python scripts/validate-compose.py
